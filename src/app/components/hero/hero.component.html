<section class="hero-section d-flex align-items-center justify-content-center text-center text-white">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <span class="badge rounded-pill bg-warning text-dark mb-3 px-3 py-2 fw-bold shadow">
          <i class="bi bi-trophy-fill me-2"></i> National Innovation Award Winner
        </span>
        
        <h1 class="display-3 fw-bold mb-3">{{ name }}</h1>
        <h2 class="h4 mb-4 text-light opacity-75">{{ title }}</h2>
        
        <p class="lead mb-5 mx-auto text-light-50" style="max-width: 600px;">
          {{ description }}
        </p>

        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
          <a href="#projects" class="btn btn-primary btn-lg px-4 gap-3 shadow">ดูผลงานของผม</a>
          <a href="#contact" class="btn btn-outline-light btn-lg px-4">ติดต่อพูดคุย</a>
        </div>
      </div>
    </div>
  </div>
</section>
