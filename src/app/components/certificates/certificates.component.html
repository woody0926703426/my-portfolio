<section id="certificates" class="py-5"> ... </section>
<div class="container py-5" id="certificates">
  <h2 class="text-center fw-bold mb-5">Certificates & Awards</h2>
  
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let cert of certificates">
      <div class="cert-card shadow-sm border-0 rounded-4 overflow-hidden bg-white">
        <div class="cert-img-container">
          <img [src]="cert.image" [alt]="cert.title" class="img-fluid">
        </div>
        <div class="p-3 text-center">
          <h6 class="fw-bold mb-1">{{ cert.title }}</h6>
          <p class="small text-muted mb-0">{{ cert.issuer }} ({{ cert.year }})</p>
        </div>
      </div>
    </div>
  </div>
</div>
