<div class="container py-5" id="skills">
  <h2 class="text-center fw-bold mb-5">Technical Skills</h2>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let group of skillGroups">
      <div class="card h-100 border-0 shadow-sm p-4">
        <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">{{ group.title }}</h5>
        
        <div class="mb-4" *ngFor="let s of group.skills">
          <div class="d-flex justify-content-between mb-1">
            <span class="fw-medium"><i [class]="s.icon" class="me-2"></i>{{ s.name }}</span>
            <span class="text-muted">{{ s.level }}%</span>
          </div>
          <div class="progress" style="height: 8px;">
            <div class="progress-bar bg-dark" 
                 role="progressbar" 
                 [style.width]="s.level + '%'" 
                 [attr.aria-valuenow]="s.level" 
                 aria-valuemin="0" 
                 aria-valuemax="100">
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
