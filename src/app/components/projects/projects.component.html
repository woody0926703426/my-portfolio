<section id="projects" class="py-5 bg-light">
  <div class="container py-5">
    <h2 class="text-center fw-bold mb-4">My Projects</h2>

    <div class="text-center mb-5">
      <div class="btn-group shadow-sm">
        <button (click)="selectedCategory = 'All'" class="btn btn-outline-dark" [class.active]="selectedCategory === 'All'">All</button>
        <button (click)="selectedCategory = 'Web'" class="btn btn-outline-dark" [class.active]="selectedCategory === 'Web'">Web</button>
        <button (click)="selectedCategory = 'IoT'" class="btn btn-outline-dark" [class.active]="selectedCategory === 'IoT'">IoT</button>
        <button (click)="selectedCategory = 'AI'" class="btn btn-outline-dark" [class.active]="selectedCategory === 'AI'">AI</button>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let item of filteredProjects; let i = index">
        <div class="card h-100 border-0 shadow-sm overflow-hidden project-card">
          
          <div class="project-img-box" style="height: 220px; background-color: #f8f9fa;">
            <img *ngIf="item.imageUrl" [src]="item.imageUrl" class="card-img-top" [alt]="item.title"
                 style="width: 100%; height: 100%; object-fit: cover;">
            <div *ngIf="!item.imageUrl" class="h-100 d-flex align-items-center justify-content-center text-muted">
              <i class="bi bi-image fs-1"></i>
            </div>
          </div>

          <div class="card-body d-flex flex-column">
            <div class="mb-2">
              <span class="badge bg-primary-subtle text-primary border border-primary-subtle">
                {{ item.category }}
              </span>
            </div>
            <h5 class="card-title fw-bold mb-2">{{ item.title }}</h5>
            <p class="card-text text-muted small flex-grow-1">
              {{ item.desc }} </p>
            
            <div class="d-flex flex-wrap gap-1 mb-3">
              <span *ngFor="let t of item.tags" class="badge rounded-pill bg-light text-dark border small">
                {{ t }} </span>
            </div>

            <button class="btn btn-dark w-100 mt-auto" data-bs-toggle="modal" [attr.data-bs-target]="'#projectModal' + i">
              View Details
            </button>
          </div>
        </div>

        <div class="modal fade" [id]="'projectModal' + i" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
              <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold">{{ item.title }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <img [src]="item.imageUrl" class="img-fluid rounded shadow-sm" [alt]="item.title">
                  </div>
                  <div class="col-md-6">
                    <h6 class="fw-bold text-primary"><i class="bi bi-info-circle-fill me-2"></i>Project Overview</h6>
                    <p class="text-muted small mb-4">{{ item.fullDescription || item.desc }}</p>
                    
                    <h6 class="fw-bold text-primary"><i class="bi bi-cpu-fill me-2"></i>Key Technologies</h6>
                    <div class="d-flex flex-wrap gap-2 mb-4">
                      <span *ngFor="let t of item.tags" class="badge bg-light text-dark border">{{ t }}</span>
                    </div>

                    <h6 class="fw-bold text-primary"><i class="bi bi-check-circle-fill me-2"></i>Challenges & Solutions</h6>
                    <ul class="small text-muted ps-3">
                      <li *ngFor="let point of item.challenges">{{ point }}</li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <a *ngIf="item.link && item.link !== '#'" [href]="item.link" target="_blank" class="btn btn-primary">
                  <i class="bi bi-globe me-2"></i>Visit Project
                </a>
              </div>
            </div>
          </div>
        </div>
        </div> </div>
  </div>
</section>
