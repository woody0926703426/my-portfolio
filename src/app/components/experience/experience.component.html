<section id="experience" class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center fw-bold mb-5">WORKING EXPERIENCE</h2>
    
    <div class="row">
      <div class="col-lg-6 mb-4">
        <h4 class="text-primary mb-4 border-start border-4 border-primary ps-3">Technical Internship</h4>
        
        <div *ngFor="let exp of techExp" class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            
        <div class="mb-3 mt-2 d-flex justify-content-center">
            <div class="text-center">
                <img [src]="exp.image" 
                class="img-fluid rounded-3 shadow-sm border" 
                style="max-height: 250px; width: auto;">

            </div>
        </div>

            <h5 class="fw-bold mb-1">{{ exp.position }}</h5>
            <p class="text-muted small mb-2"><i class="bi bi-building me-2"></i>{{ exp.company }} | {{ exp.period }}</p>
            <p class="card-text">{{ exp.description }}</p>
            
            <div class="d-flex flex-wrap gap-2">
              <span *ngFor="let tool of exp.tools" class="badge bg-soft-primary text-primary">{{ tool }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <h4 class="text-secondary mb-4 border-start border-4 border-secondary ps-3">Professional Experience</h4>
        
        <div *ngFor="let item of otherExp" class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <h5 class="fw-bold mb-1">{{ item.position }}</h5>
            <p class="text-muted small mb-2"><i class="bi bi-clock me-2"></i>{{ item.company }} | {{ item.period }}</p>
            <p class="card-text">{{ item.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
